# "Production" deployment (VPS): PUBLIC honeypot on :8080 behind a reverse proxy
# (nginx), and the dashboard on localhost only (SSH tunnel) by default.
# Usage:  docker compose -p chakravyuh -f deploy/docker-compose.vps.yml up -d --build
services:
  chakravyuh:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: chakravyuh-ai
    # The honeypot (:8080) is NOT published directly: it sits behind nginx (the `edge`
    # service), which owns the socket and emits real-server headers (Server: nginx),
    # hiding the ASGI stack. The dashboard stays on localhost only (SSH tunnel) by default.
    expose:
      - "8080"
      - "5000"
    ports:
      - "127.0.0.1:5000:5000"    # dashboard via tunnel → ssh -L 5000:localhost:5000
    volumes:
      - chakravyuh-data:/app/data
    environment:
      - CHAKRAVYUH_DB_PATH=/app/data/chakravyuh.db
      - CHAKRAVYUH_HONEYPOT_PORT=8080
      - CHAKRAVYUH_DASHBOARD_PORT=5000
      # Content: Template (generic, zero-config) by default. To mimic a REAL site you
      # control, use Mimic + the target URL (read-only crawl):
      - CHAKRAVYUH_GENERATION_MODE=Template
      # - CHAKRAVYUH_GENERATION_MODE=Mimic
      # - CHAKRAVYUH_TARGET_URL=https://your-target.example.com
      # - CHAKRAVYUH_SITE_PROFILE=saas          # optional: saas|corp|ecommerce|nonprofit
      - CHAKRAVYUH_REALISM_LEVEL=3
      # Realistic sparse lure (a .env.bak with a token → hidden ops console); triggers credential_reuse.
      - CHAKRAVYUH_SCENARIOS_ENABLED=true
      # World (inert multi-site static content) enabled; auto-seeds the bundled seed.
      - CHAKRAVYUH_WORLD_ENABLED=true
      # With World, the aggressive tarpit is a tell (delays on static files). OFF.
      - CHAKRAVYUH_ADAPTIVE_TARPIT=false
      # Active blocking: 403 for confirmed attackers (credential_reuse always blocks).
      - CHAKRAVYUH_ENFORCE_BLOCK=true
      - CHAKRAVYUH_AUTO_BLOCK_SCORE=0.0
      # AI confirmation: heuristic (no cost). For an LLM: CHAKRAVYUH_AI_PROVIDER=openai + base_url/api_key/model.
      - CHAKRAVYUH_AI_ENABLED=false
      - CHAKRAVYUH_AI_PROVIDER=heuristic
      # Public URL for remote sensors (agent/agentless), served behind YOUR TLS:
      - CHAKRAVYUH_PUBLIC_URL=https://chakravyuh.example.com
      # Dashboard auth (single admin). The password and session secret are NOT committed:
      # inject them via the host environment (export CHAKRAVYUH_ADMIN_PASSWORD=... before 'up'), or
      # leave the password empty and read it ONCE from the container log (it is generated and printed).
      - CHAKRAVYUH_ADMIN_USER=admin
      - CHAKRAVYUH_ADMIN_PASSWORD=${CHAKRAVYUH_ADMIN_PASSWORD:-}
      - CHAKRAVYUH_SESSION_SECRET=${CHAKRAVYUH_SESSION_SECRET:-}
      - CHAKRAVYUH_COOKIE_SECURE=true   # the admin subdomain is served over HTTPS
    restart: unless-stopped
    networks:
      - default
      # To expose the dashboard on a TLS subdomain with YOUR reverse proxy (Caddy/Traefik/nginx),
      # uncomment and attach it to your proxy's external network (see deploy/caddy-admin.snippet):
      # - proxy

  # Reverse proxy in front of the honeypot: owns the public :8080 socket and emits real-nginx
  # headers; forwards the attacker's real IP via X-Forwarded-For (the honeypot reads it from there).
  edge:
    image: nginx:1.27-alpine
    container_name: chakravyuh-edge
    depends_on:
      - chakravyuh
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - ./honeypot.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - default

volumes:
  chakravyuh-data:

networks:
  default: {}
  # External network of YOUR reverse proxy (e.g. the one serving the admin subdomain). Uncomment,
  # adjust the name and add `- proxy` to the `chakravyuh` service networks to attach it to an existing proxy:
  # proxy:
  #   external: true
  #   name: your-proxy-network
