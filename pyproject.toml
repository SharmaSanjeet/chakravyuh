[project]
name = "chakravyuh"
version = "0.1.0"
description = "Chakravyuh — honeypot against autonomous AI agents: token-drain maze, behavioral detection and CTF scenarios."
authors = [{ name = "Sanjeet Sharma" }]
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
]

[project.scripts]
chakravyuh = "chakravyuh.main:main"
chakravyuh-architect = "chakravyuh.architect.main:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Depends() en defaults es el patrón idiomático de FastAPI

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chakravyuh"]
